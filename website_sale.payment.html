<t name="Payment" t-name="website_sale.payment">
        <t t-call="website_sale.checkout_layout">
            <t t-set="additional_title">Comprar - Seleccionar método de pago</t>
            <t t-set="redirect" t-valuef="/shop/payment"/>
            <t t-set="oe_structure">
                <!-- This is the drag-and-drop area for website building blocs at the end of each
                     checkout page. This is append at the of the page in `checkout_layout`. The
                     templates created in the database to store blocs are hooked using XPath on the
                     `oe_struture` element ID. Therefore, we can't use dynamic IDs (like with
                     t-att-id) and each template needs to define a div element. -->
                <div class="oe_structure" id="oe_structure_website_sale_payment_2"/>
            </t>
            <div class="col-12" t-if="errors">
                <t t-set="hide_payment_button" t-value="True"/>
                <t t-foreach="errors" t-as="error">
                    <div class="alert alert-danger" t-if="error" role="alert">
                        <h4>
                            <t t-out="error[0]"/>
                        </h4>
                        <t t-out="error[1]"/>
                    </div>
                </t>
            </div>
            <div class="oe_structure clearfix" id="oe_structure_website_sale_payment_1"/>

            <div t-if="not errors and website_sale_order.amount_total" name="website_sale_non_free_cart">
                <div id="payment_method" class="o_not_editable mb-3">
                    <t t-call="payment.form"/>
                </div>
                <t t-if="not (payment_methods_sudo or tokens_sudo)" t-set="hide_payment_button" t-value="True"/>
            </div>
            <h4 t-else="" class="mb-3">
                Confirmar orden
            </h4>
            <div id="address_on_payment">
                <t t-call="website_sale.address_on_checkout"/>
            </div>
                <style>
                    img.img.img-fluid.bankcardpng {
                        height: 30px;
                        width: 45px;
                    }
                    ul.list-group {
                        height: 10rem;
                    }
                </style>
                <script>
                    (function () {
                        function actualizarLogosPago() {
                            const amexImg = document.querySelector(
                                'img[alt="American Express"]'
                            );

                            if (!amexImg) return;

                            const container = amexImg.closest('.gap-1.flex-wrap.d-flex');

                            if (!container) return;

                            if (container.dataset.paymentLogosUpdated === 'true') {
                                return;
                            }

                            container.dataset.paymentLogosUpdated = 'true';

                            Array.from(container.children).forEach(span =&gt; {
                                const img = span.querySelector('img');

                                if (!img || img.alt !== 'American Express') {
                                    span.remove();
                                }
                            });

                            const visaSpan = document.createElement('span');

                            visaSpan.className = 'position-relative d-block rounded overflow-hidden z-1 shadow-sm';
                            visaSpan.setAttribute('data-bs-toggle', 'tooltip');
                            visaSpan.setAttribute('data-bs-placement', 'top');
                            visaSpan.setAttribute('data-bs-delay', '0');
                            visaSpan.setAttribute('aria-label', 'Visa');
                            visaSpan.setAttribute('data-bs-original-title', 'Visa');

                            const visaImg = document.createElement('img');

                            visaImg.src =
                                'https://live.staticflickr.com/65535/55550525016_201fd34462_z.jpg';

                            visaImg.className = 'img img-fluid bankcardpng';
                            visaImg.alt = 'Visa';
                            visaImg.loading = 'lazy';

                            visaSpan.appendChild(visaImg);

                            const mastercardSpan = document.createElement('span');

                            mastercardSpan.className = 'position-relative d-block rounded overflow-hidden z-1 shadow-sm';

                            mastercardSpan.setAttribute('data-bs-toggle', 'tooltip');
                            mastercardSpan.setAttribute('data-bs-placement', 'top');
                            mastercardSpan.setAttribute('data-bs-delay', '0');
                            mastercardSpan.setAttribute('aria-label', 'Mastercard');
                            mastercardSpan.setAttribute('data-bs-original-title', 'Mastercard');

                            const mastercardImg = document.createElement('img');

                            mastercardImg.src =
                                'https://live.staticflickr.com/65535/55550625491_8b143180ec_h.jpg';

                            mastercardImg.className = 'img img-fluid bankcardpng';
                            mastercardImg.alt = 'Mastercard';
                            mastercardImg.loading = 'lazy';

                            mastercardSpan.appendChild(mastercardImg);

                            container.appendChild(visaSpan);
                            container.appendChild(mastercardSpan);
                        }

                        if (document.readyState === 'loading') {
                            document.addEventListener(
                                'DOMContentLoaded',
                                actualizarLogosPago
                            );
                        } else {
                            actualizarLogosPago();
                        }
                    })();
                </script>
        </t>
    </t>
