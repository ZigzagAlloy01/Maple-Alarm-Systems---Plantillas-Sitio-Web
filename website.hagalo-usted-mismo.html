<t t-name="website.hagalo-usted-mismo">
    <t t-call="website.layout">
        <section>
            <div class="container_hagalo_usted">
                <div id="mapleHagaloUstedHeader"/>
                <div id="DIY_presentation_text_container"/>
                <div id="mapleHagaloUstedGridPrincipal"/>
            </div>
        </section>
        <xpath expr="//head" position="inside">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
            <style type="text/css">
                div#DIY_presentation_text_container {
                    display: flex;
                    justify-self: center;
                    max-width: 64rem;
                    margin: 1rem 0 0 0;
                }

                .DIY_presentation_text {
                    display: flex;
                    font-size: 1.2rem;
                    font-weight: 500;
                    justify-self: center;
                    text-align: center;
                    line-height: 1.3;
                    margin: 0 4rem;
                }

                .container_hagalo_usted {
                    margin: 2rem 0 0 0;
                }

                div#mapleHagaloUstedGridPrincipal {
                    display: flex;
                    justify-content: center;
                    margin: 2rem 0 2rem 0;
                }

                .hagalo_usted_cards {
                    display: flex;
                    max-width: fit-content;
                    gap: 2rem;
                }

                .hagalo_usted_card {
                    width: 32rem;
                    cursor: pointer;
                }

                .card-body.d-flex.align-items-center {
                    justify-content: center;
                }

                h5.card-title {
                    text-align: center;
                    font-size: 1.6rem !important;
                    font-weight: 600;
                    font-family: "Montserrat", sans-serif !important;
                }

                img.hagalo_usted_card_img {
                    height: 80%;
                }

                .btn-seleccionar-tamano {
                    border-radius: 20px;
                    padding: 8px 30px;
                }

                #Alarmasparaelhogar, #Alarmasparanegocios, i.fa-solid.fa-house-chimney::before, i.fa-solid.fa-store::before {
                    align-self: center;
                }

                #Alarmasparaelhogar, #Alarmasparanegocios {
                    width: 80% !important;
                }

                .mt-4.text-muted.personalizedicon {
                    display: flex;
                    justify-content: center;
                    margin: 0 0 2rem 0;
                }

                ul.list-unstyled.text-start.mb-4 {
                    align-self: center;
                    max-width: 19rem;
                    margin: 1rem 1rem;
                }

                ul.list-unstyled.text-start.mb-4 li {
                    text-align: justify;
                    line-height: 1.8;
                }

                @media (max-width: 1200px) {
                    .hagalo_usted_card {
                        width: 24rem;
                    }

                    ul.list-unstyled.text-start.mb-4 {
                        max-width: 15.625rem;
                    }
                }

                @media (max-width: 1000px) {
                    .hagalo_usted_card {
                        width: 20rem;
                    }
                }

                @media (max-width: 780px) {
                    .hagalo_usted_cards {
                        flex-direction: column;
                    }

                    .hagalo_usted_card {
                        width: 32rem;
                    }
                }

                @media (max-width: 720px) {
                    .DIY_presentation_text {
                        font-size: 1rem;
                        margin: 2rem 1rem;
                    }
                }

                @media (max-width: 620px) {
                    .hagalo_usted_card {
                        width: 28rem;
                    }
                }

                @media (max-width: 520px) {
                    .hagalo_usted_card {
                        width: 24rem;
                    }
                }

                @media (max-width: 500px) {
                    h5.card-title {
                        font-size: 1rem;
                    }
                }

                @media (max-width: 480px) {
                    .hagalo_usted_card {
                        width: 20rem;
                    }
                }

                @media (max-width: 480px) {
                    .hagalo_usted_card {
                        width: 16rem;
                    }
                }
            </style>
        </xpath>
        <xpath expr="//head" position="inside">
            <script type="text/javascript">
                const HAGALO_USTED_CATEGORIAS = [
                    {
                        "categoryId": "10",
                        "title": "Alarmas",
                        "img_url": "",
                        "url": "/hagalo-usted-mismo",
                        "children":[
                            {
                                "categoryId": "11",
                                "title": "Alarmas para el hogar",
                                "img_url": "https://live.staticflickr.com/65535/55522613060_a11b5be3e3_m.jpg",
                                "url": "/11",
                                "icon_class": "fa-house-chimney",
                                "specs": ["Protección familiar y residencial", "Monitoreo de puertas, ventanas y pasillos", "Sistemas con notificaciones inmediatas"]
                            },
                            {
                                "categoryId": "12",
                                "title": "Alarmas para negocios",
                                "img_url": "https://live.staticflickr.com/65535/55522229276_39453c957d_m.jpg",
                                "url": "/12",
                                "icon_class": "fa-store",
                                "specs": ["Protección de mercancía y espacios de trabajo", "Alerta de accesos fuera de horario", "Equipos escalables para comercios, oficinas o fábricas"]
                            }
                        ]
                    }
                ]

                function getHagaloUstedCategorias(categoryId) {
                    return HAGALO_USTED_CATEGORIAS.find(categoria =&gt; 
                        String(categoria.categoryId) === String(categoryId)  
                    ); 
                }

                function renderHagaloUstedUI(categoryId) {
                    const categoria = getHagaloUstedCategorias(categoryId);
                    const headerContainer = document.getElementById('mapleHagaloUstedHeader');
                    const descriptionContainer = document.getElementById('DIY_presentation_text_container');
                    const gridContainer = document.getElementById('mapleHagaloUstedGridPrincipal');
                    const MAPLE_LANDING_URL = `/cuestionario-hagalo-usted-mismo`;

                    if (!categoria) {
                        if (headerContainer) headerContainer.innerHTML = '<h1 class="text-center">Categoría no encontrada</h1>';
                        if (gridContainer) gridContainer.innerHTML = '';
                        return;
                    }

                    if (headerContainer) {
                        headerContainer.innerHTML = `
                            <h1 class="text-center">${categoria.title}</h1>
                        `;
                    }

                    if (descriptionContainer) {
                        descriptionContainer.innerHTML = `
                            <p class="DIY_presentation_text">
                                Aquí podrás comprar tu sistema de alarma a tu medida. Selecciona los equipos y servicios que necesitas y conoce el precio de tu solución de seguridad con Maple.
                            </p>
                        `;
                    }

                    if (gridContainer &amp;&amp; categoria.children &amp;&amp; categoria.children.length &gt; 0) {
                        let cardsHTML = '<div class="hagalo_usted_cards">';
                        categoria.children.forEach(child =&gt; {
                            const urlDestino = `${MAPLE_LANDING_URL}?category=${encodeURIComponent(child.categoryId)}`;
                            const titlecut = child.title.trim().replaceAll(' ', '');
                            let specsHtml = child.specs.map(s =&gt; `<li> ● ${s}</li>`).join('');
                            cardsHTML += `
                                <div class="hagalo_usted_card">
                                    <a onclick="window.location.href='${urlDestino}'" class="card h-100 text-decoration-none text-dark shadow-sm">
                                        <div class="card-body d-flex align-items-center">
                                            <h5 class="card-title">${child.title}</h5>
                                        </div>
                                        <ul class="list-unstyled text-start mb-4">
                                            ${specsHtml}
                                        </ul>
                                        <button class="btn btn-primary w-100 btn-seleccionar-tamano mt-auto" id="${titlecut}">Seleccionar</button>
                                        <div class="mt-4 text-muted personalizedicon" style="font-size: 4rem;">
                                            <i class="fa-solid ${child.icon_class}"/>
                                        </div>
                                    </a>
                                </div>
                            `;
                        });
                        
                        cardsHTML += '</div>';
                        gridContainer.innerHTML = cardsHTML;

                    } else if (gridContainer) {
                        gridContainer.innerHTML = '<p class="text-center">No hay subcategorías disponibles.</p>';
                    }
                }

                document.addEventListener('DOMContentLoaded', () =&gt; {
                    if (HAGALO_USTED_CATEGORIAS &amp;&amp; HAGALO_USTED_CATEGORIAS.length &gt; 0) {
                            const firstCategoryId = HAGALO_USTED_CATEGORIAS[0].categoryId;
                        renderHagaloUstedUI(firstCategoryId);
                    } else {
                        const headerContainer = document.getElementById('mapleHagaloUstedHeader');
                        const gridContainer = document.getElementById('mapleHagaloUstedGridPrincipal');
                        if (headerContainer) {
                            headerContainer.innerHTML = '<h1 class="text-center">No hay categorías configuradas</h1>';
                        }
                        if (gridContainer) {
                            gridContainer.innerHTML = '';
                        }
                    }
                });     
            </script>
        </xpath>
    </t>
</t>
