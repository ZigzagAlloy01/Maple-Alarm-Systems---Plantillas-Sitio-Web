<t t-name="website.hagalo-usted-mismo">
    <t t-call="website.layout">
        <section>
            <div class="container_hagalo_usted">
                <div id="mapleHagaloUstedHeader"/>
                <div id="mapleHagaloUstedGridPrincipal"/>
            </div>
        </section>
        <xpath expr="//head" position="inside">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
            <style type="text/css">
                .container_hagalo_usted {
                    margin: 2rem 0 0 0;
                }

                div#mapleHagaloUstedGridPrincipal {
                    display: flex;
                    justify-content: center;
                    margin: 2rem 0 2rem 0;
                }

                .hagalo_usted_cards {
                    display: flex;
                    max-width: fit-content;
                    gap: 2rem;
                }

                .hagalo_usted_card {
                    width: 20rem;
                    cursor: pointer;
                }

                .card-body.d-flex.align-items-center.justify-content-between {
                    margin: 0 1rem 0 2rem;
                }

                i.fa-solid.fa-chevron-right.text-muted {
                    margin: 0 0 0 2rem;
                }

                h5.card-title.m-0 {
                    text-align: center;
                }

                img.hagalo_usted_card_img {
                    height: 80%;
                }

                @media (max-width: 780px) {
                    .hagalo_usted_cards {
                        flex-direction: column;
                    }
                }

                @media (max-width: 500px) {
                    .hagalo_usted_card {
                        width: 16rem;
                    }

                    h5.card-title.m-0 {
                        font-size: 1rem;
                    }

                    .card-body.d-flex.align-items-center.justify-content-between {
                        margin: 0 0rem 0 0rem;
                    }

                    i.fa-solid.fa-chevron-right.text-muted {
                        margin: 0 0 0 0rem;
                    }
                }
            </style>
        </xpath>
        <xpath expr="//head" position="inside">
            <script type="text/javascript">
                const HAGALO_USTED_CATEGORIAS = [
                    {
                        "categoryId": "10",
                        "title": "Alarmas",
                        "img_url": "",
                        "url": "/hagalo-usted-mismo",
                        "children":[
                            {
                                "categoryId": "11",
                                "title": "Alarmas para el hogar",
                                "img_url": "https://live.staticflickr.com/65535/55522613060_a11b5be3e3_m.jpg",
                                "url": "/11"
                            },
                            {
                                "categoryId": "12",
                                "title": "Alarmas para negocios",
                                "img_url": "https://live.staticflickr.com/65535/55522229276_39453c957d_m.jpg",
                                "url": "/12"
                            }
                        ]
                    }
                ]

                function getHagaloUstedCategorias(categoryId) {
                    return HAGALO_USTED_CATEGORIAS.find(categoria =&gt; 
                        String(categoria.categoryId) === String(categoryId)  
                    ); 
                }

                function renderHagaloUstedUI(categoryId) {
                    const categoria = getHagaloUstedCategorias(categoryId);
                    const headerContainer = document.getElementById('mapleHagaloUstedHeader');
                    const gridContainer = document.getElementById('mapleHagaloUstedGridPrincipal');
                    const MAPLE_LANDING_URL = `/cuestionario-hagalo-usted-mismo`;

                    if (!categoria) {
                        if (headerContainer) headerContainer.innerHTML = '<h1 class="text-center">Categoría no encontrada</h1>';
                        if (gridContainer) gridContainer.innerHTML = '';
                        return;
                    }

                    if (headerContainer) {
                        headerContainer.innerHTML = `
                            <h1 class="text-center">${categoria.title}</h1>
                        `;
                    }

                    if (gridContainer &amp;&amp; categoria.children &amp;&amp; categoria.children.length &gt; 0) {
                        let cardsHTML = '<div class="hagalo_usted_cards">';
                        categoria.children.forEach(child =&gt; {
                            const urlDestino = `${MAPLE_LANDING_URL}?category=${encodeURIComponent(child.categoryId)}`;
                            cardsHTML += `
                                <div class="hagalo_usted_card">
                                    <a onclick="window.location.href='${urlDestino}'" class="card h-100 text-decoration-none text-dark shadow-sm">
                                        <img class="hagalo_usted_card_img" srcset="${child.img_url}" alt="${child.title}"/>
                                        <div class="card-body d-flex align-items-center justify-content-between">
                                            <h5 class="card-title m-0">${child.title}</h5>
                                            <i class="fa-solid fa-chevron-right text-muted"/>
                                        </div>
                                    </a>
                                </div>
                            `;
                        });
                        
                        cardsHTML += '</div>';
                        gridContainer.innerHTML = cardsHTML;

                    } else if (gridContainer) {
                        gridContainer.innerHTML = '<p class="text-center">No hay subcategorías disponibles.</p>';
                    }
                }

                document.addEventListener('DOMContentLoaded', () =&gt; {
                    if (HAGALO_USTED_CATEGORIAS &amp;&amp; HAGALO_USTED_CATEGORIAS.length &gt; 0) {
                            const firstCategoryId = HAGALO_USTED_CATEGORIAS[0].categoryId;
                        renderHagaloUstedUI(firstCategoryId);
                    } else {
                        const headerContainer = document.getElementById('mapleHagaloUstedHeader');
                        const gridContainer = document.getElementById('mapleHagaloUstedGridPrincipal');
                        if (headerContainer) {
                            headerContainer.innerHTML = '<h1 class="text-center">No hay categorías configuradas</h1>';
                        }
                        if (gridContainer) {
                            gridContainer.innerHTML = '';
                        }
                    }
                });     
            </script>
        </xpath>
    </t>
</t>
