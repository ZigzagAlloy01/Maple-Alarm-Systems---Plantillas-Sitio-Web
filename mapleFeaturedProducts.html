<xpath expr="//head" position="inside">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
            <script src="https://unpkg.com/@phosphor-icons/web"/>
            <style type="text/css">
                :root {
                    --maple-primary:#0D2E67;
                    --maple-secondary:#FF8A00;
                    --maple-border:#E5E7EB;
                    --maple-bg:#F7F8FA;
                    --maple-text:#1F2937;
                    --maple-muted:#6B7280;

                    --maple-radius:16px;
                    --maple-shadow:0 10px 30px rgba(0,0,0,.08);
                }

                HTML {
                    box-sizing: border-box;
                    padding: 0;
                    margin: 0;
                }
                .maple-homepage {
                    --maple-red: #b20816;
                    --maple-red-dark: #790711;
                    --maple-ink: #111827;
                    --maple-muted: #5b6472;
                    --maple-line: #e7e9ee;
                    --maple-surface: #ffffff;
                    --maple-soft: #f5f7fa;
                    color: var(--maple-ink);
                    background: #ffffff;
                }

                .maple-homepage * {
                    box-sizing: border-box;
                }

                .maple-homepage a {
                    text-decoration: none;
                }

                .maple-kicker {
                    margin: 0 0 0.65rem;
                    color: var(--maple-red);
                    font-size: 2rem;
                    font-weight: 800;
                    letter-spacing: 0;
                    text-transform: uppercase;
                }

                .maple-section {
                    padding: 4.5rem 0;
                }

                .maple-section__header {
                    display: flex;
                    align-items: end;
                    justify-content: space-between;
                    gap: 1.5rem;
                    margin-bottom: 1.75rem;
                }

                .maple-section__header h2,
                .maple-final-cta h2 {
                    margin: 0;
                    font-size: clamp(2rem, 4vw, 3.15rem);
                    line-height: 1.03;
                    letter-spacing: 0;
                }

                .maple-section__header p,
                .maple-final-cta p {
                    max-width: 720px;
                    margin: 0.65rem 0 0;
                    color: var(--maple-muted);
                    font-size: 1.02rem;
                    line-height: 1.55;
                }

                .maple-section__header--compact {
                    align-items: start;
                }

                .maple-section__header--center {
                    justify-content: center;
                    text-align: center;
                }

                .maple-link {
                    display: inline-flex;
                    align-items: center;
                    gap: 0.45rem;
                    color: var(--maple-red);
                    font-weight: 800;
                    white-space: nowrap;
                }

                .maple-link:hover {
                    color: var(--maple-red-dark);
                }

                .maple-btn {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    min-height: 46px;
                    padding: 0.75rem 1.15rem;
                    border-radius: 8px;
                    font-weight: 800;
                }

                .maple-btn--primary {
                    background: var(--maple-red);
                    border-color: var(--maple-red);
                    color: #ffffff;
                }

                .maple-btn--primary:hover {
                    background: var(--maple-red-dark);
                    border-color: var(--maple-red-dark);
                    color: #ffffff;
                }

                .maple-btn--ghost {
                    border: 1px solid rgba(255, 255, 255, 0.45);
                    color: #ffffff;
                    background: rgba(255, 255, 255, 0.08);
                }

                .maple-btn--ghost:hover {
                    color: #ffffff;
                    background: rgba(255, 255, 255, 0.16);
                }

                .maple-hero {
                    position: relative;
                    min-height: 100%;
                    display: flex;
                    align-items: stretch;
                    overflow: hidden;
                    background: #15171d;
                    isolation: isolate;
                    cursor: pointer;
                }

                .maple-hero__slides{
                    display: grid;
                    position:relative;
                    width:100%;
                    height:100%;

                }

                .maple-hero__slide{
                    grid-area: 1 / 1;
                    background-size: cover;
                    background-position: center;
                    opacity:0;
                    transition:
                        opacity .7s ease,
                        transform .7s ease;
                    transform:scale(1.02);
                    z-index: 1;
                }

                .maple-hero__slide.active{

                    opacity:1;
                    transform:scale(1);

                    z-index:2;

                }

                .maple-hero__slide::before{

                    content:"";

                    position:absolute;
                    inset:0;

                    background:
                        linear-gradient(
                            90deg,
                            rgba(0,0,0,.60),
                            rgba(0,0,0,.35),
                            rgba(0,0,0,.10)
                        );
                    z-index: 1;
                    pointer-events: none;
                }

                .maple-prev,
                .maple-next{

                    position:absolute;

                    top:50%;
                    transform:translateY(-50%);

                    width:58px;
                    height:58px;

                    border:none;

                    border-radius:50%;

                    background:#fff;

                    cursor:pointer;

                    font-size:38px;

                    z-index:20;

                    transition:.25s;

                    box-shadow:0 8px 30px rgba(0,0,0,.15);

                }

                .maple-prev{

                    left:20px;

                }

                .maple-next{

                    right:20px;

                }

                .maple-prev:hover,
                .maple-next:hover{

                    transform:translateY(-50%) scale(1.05);

                }

                .maple-dots{

                    position:absolute;

                    left:50%;
                    bottom: 3.7rem;

                    transform:translateX(-50%);

                    display:flex;

                    gap:12px;

                    z-index:50;

                }

                .maple-dot{

                    width:11px;
                    height:11px;

                    border-radius:50%;

                    background:rgba(255,255,255,.4);

                    cursor:pointer;

                    transition:.3s;

                }

                .maple-dot.active{

                    background:#fff;

                    transform:scale(1.35);

                }

                .maple-slide-bg{

                    position:absolute;

                    inset:0;
                    z-index: 0;

                }

                .maple-slide-bg--blue{

                    background:
                    radial-gradient(circle at right,
                        #1e88e5 0%,
                        #0b3f87 40%,
                        #06172d 100%);

                }

                .maple-slide-bg--dark{

                    background:
                    radial-gradient(circle at right,
                        #555 0%,
                        #222 45%,
                        #111 100%);

                }

                .maple-slide-product{

                    position:absolute;

                    right:1%;

                    bottom:-60%;

                    max-height:88%;

                    max-width:42%;

                    object-fit:contain;

                    z-index:5;

                }

                .maple-hero__media {
                    position: absolute;
                    inset: 0;
                    background:
                        linear-gradient(90deg, rgba(8, 10, 14, 0.93) 0%, rgba(8, 10, 14, 0.72) 44%, rgba(8, 10, 14, 0.2) 100%),
                        url("/web/image/5754-c54088e0/Monitorea%20tu%20Alarma%20%281%29.webp") center / cover no-repeat;
                    z-index: -1;
                }

                .maple-hero__content {
                        display: grid;
                        grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.56fr);
                        gap: 2rem;
                        align-items: end;
                        padding: 0 5%;
                        position: relative;
                        z-index: 10;
                    }
        
                    .maple-hero__copy {
                        max-width: 760px;
                        color: #ffffff;
                        grid-column: 1 / -1;
                        justify-self: start;
                    }

                .maple-hero__copy h1 {
                    margin: 0;
                    max-width: 820px;
                    color: #ffffff;
                    font-size: clamp(2.55rem, 5vw, 4.25rem);
                    line-height: 0.98;
                    letter-spacing: 0;
                }

                .maple-hero__lead {
                    max-width: 640px;
                    margin: 1.25rem 0 1.25rem 0;
                    color: rgba(255, 255, 255, 0.84);
                    font-size: 1.5rem;
                    line-height: 1.65;
                }

                .maple-hero__actions {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 0.85rem;
                    margin: 2rem 0 3rem 0;
                }

                .maple-hero__panel {
                    display: grid;
                    gap: 0.75rem;
                    align-self: end;
                }
                
                .maple-hero__panel div span {
                    font-size: 1.5rem;
                }
                
                .maple-hero__panel div strong {
                    font-size: 2rem;
                }

                .maple-hero__panel div {
                    padding: 1rem;
                    border: 1px solid rgba(255, 255, 255, 0.18);
                    border-radius: 8px;
                    background: rgba(255, 255, 255, 0.09);
                    backdrop-filter: blur(10px);
                    color: #ffffff;
                }

                .maple-hero__panel strong,
                .maple-hero__panel span {
                    display: block;
                    text-align: justify;
                }

                .maple-hero__panel span {
                    margin-top: 0.35rem;
                    color: rgba(255, 255, 255, 0.76);
                    line-height: 1.45;
                }

                #services_panel {
                    padding: 2% 20%;
                    background-image: linear-gradient(135deg, rgb(233, 43, 43) 0%, rgb(69, 69, 69) 100%);
                    
                }

                .maple-categories {
                    background: var(--maple-soft);
                }

                .maple-category-grid {
                    --maple-category-columns: 4;
                    display: grid;
                    grid-template-columns: repeat(var(--maple-category-columns), minmax(0, 1fr));
                    gap: clamp(0.85rem, 1.5vw, 1.15rem);
                }

                .maple-category-card {
                    --card-accent: var(--maple-red);
                    position: relative;
                    display: grid;
                    min-width: 0;
                    min-height: 214px;
                    padding: 1.05rem;
                    border: 1px solid var(--maple-line);
                    border-radius: 8px;
                    background:
                        linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.8)),
                        linear-gradient(145deg, var(--card-accent), #2f3440);
                    color: var(--maple-ink);
                    overflow: hidden;
                    box-shadow: 0 14px 36px rgba(17, 24, 39, 0.08);
                    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
                }

                .maple-category-card::before {
                    content: "";
                    position: absolute;
                    inset: auto -20% -42% 22%;
                    height: 74%;
                    background: radial-gradient(circle, color-mix(in srgb, var(--card-accent) 22%, transparent), transparent 68%);
                    pointer-events: none;
                }

                .maple-category-card:hover,
                .maple-category-card:focus {
                    transform: translateY(-4px);
                    border-color: color-mix(in srgb, var(--card-accent) 45%, var(--maple-line));
                    box-shadow: 0 20px 45px rgba(17, 24, 39, 0.14);
                    outline: none;
                }

                .maple-category-card--red { --card-accent: #B71234; }
                .maple-category-card--graphite { --card-accent: #2D3142; }
                .maple-category-card--blue { --card-accent: #1B365D; }
                .maple-category-card--amber { --card-accent: #F57C00; }
                .maple-category-card--fire { --card-accent: #c81019; }
                .maple-category-card--green { --card-accent: #2E7D32; }
                .maple-category-card--slate { --card-accent: #475569; }
                .maple-category-card--violet { --card-accent: #5B48A8; }
                .maple-category-card--cyan { --card-accent: #0e7490; }
                .maple-category-card--rose { --card-accent: #c810a0; }

                .maple-category-card__icon {
                    width: 58px;
                    height: 58px;
                    display: grid;
                    place-items: center;
                    border-radius: 8px;
                    background: color-mix(in srgb, var(--card-accent) 14%, #ffffff);
                    border: 1px solid color-mix(in srgb, var(--card-accent) 25%, #ffffff);
                }

                .cat-374 span.maple-category-card__icon::before,
                .cat-501 span.maple-category-card__icon::before,
                .cat-520 span.maple-category-card__icon::before,
                .cat-335 span.maple-category-card__icon::before,
                .cat-351 span.maple-category-card__icon::before,
                .cat-365 span.maple-category-card__icon::before,
                .cat-358 span.maple-category-card__icon::before,
                .cat-808 span.maple-category-card__icon::before,
                .cat-482 span.maple-category-card__icon::before {
                    display: block;
                    text-align: center;
                    font-family: "FontAwesome" !important;
                    color: #040457;
                    font-size: 1.6rem;
                    line-height: 3.5rem;
                }

                .cat-374 span.maple-category-card__icon::before {
                    content: "\f0a1";
                }
                
                .cat-501 span.maple-category-card__icon::before {
                    content: "\f015";
                } 

                .cat-520 span.maple-category-card__icon::before {
                    content: "\f03d";
                } 

                .cat-335 span.maple-category-card__icon::before {
                    content: "\f084";
                } 

                .cat-351 span.maple-category-card__icon::before {
                    content: "\f0e7";
                } 

                .cat-365 span.maple-category-card__icon::before {
                    content: "\f0ac";
                } 

                .cat-358 span.maple-category-card__icon::before {
                    content: "\f1e6";
                } 

                .cat-808 span.maple-category-card__icon::before {
                    content: "\f240";
                } 

                .cat-482 span.maple-category-card__icon::before {
                    content: "\f0ad";
                }

                .maple-category-card__body {
                    display: block;
                    align-self: center;
                    min-width: 0;
                    position: relative;
                    z-index: 1;
                }

                .maple-category-card__body strong,
                .maple-category-card__body span,
                .maple-category-card__meta {
                    display: block;
                    overflow-wrap: break-word;
                }

                .maple-category-card__body strong {
                    margin-top: 1rem;
                    font-size: 1.6rem;
                    line-height: 1.12;
                    color: var(--maple-ink);
                    word-break: normal !important;  
                    display: -webkit-box;
                    -webkit-line-clamp: 2;             
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                }

                .maple-category-card__body span {
                    margin-top: 0.55rem;
                    color: var(--maple-muted);
                    font-size: 1.2rem;
                    line-height: 1.38;
                }

                .maple-category-card__meta {
                    align-self: center;
                    margin-top: 0.9rem;
                    color: color-mix(in srgb, var(--card-accent) 72%, #15171d);
                    font-weight: 800;
                    font-size: 1.2rem;
                }
                
                .catalogo-p {
                    font-size: 1.2rem !important;
                }

                .maple-solutions {
                    background: #ffffff;
                }

                .maple-solution-grid {
                    display: grid;
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                    gap: 1rem;
                }

                .maple-solution {
                    display: grid;
                    grid-template-rows: 220px 1fr;
                    overflow: hidden;
                    border: 1px solid var(--maple-line);
                    border-radius: 8px;
                    background: #ffffff;
                }

                .maple-solution img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    background: #e9edf3;
                }

                .maple-solution div {
                    padding: 1.15rem;
                }

                .maple-solution h3 {
                    margin: 0;
                    font-size: 1.2rem;
                    line-height: 1.2;
                }

                .maple-solution p {
                    margin: 0.65rem 0 1rem;
                    color: var(--maple-muted);
                    line-height: 1.55;
                }

                .maple-solution a {
                    color: var(--maple-red);
                    font-weight: 800;
                }

                .maple-products {
                    padding: 4.5rem 0;
                    background: var(--maple-soft);
                }

                .maple-products .s_dynamic_snippet_title {
                    align-items: end;
                }

                .maple-brand-strip {
                    background: #ffffff;
                }

                .maple-logo-grid {
                    display: grid;
                    grid-template-columns: repeat(6, minmax(0, 1fr));
                    gap: 1rem;
                    align-items: center;
                }

                .maple-logo-grid img {
                    width: 100%;
                    height: 92px;
                    object-fit: contain;
                    padding: 1rem;
                    border: 1px solid var(--maple-line);
                    border-radius: 8px;
                    background: #ffffff;
                    filter: grayscale(0.1);
                }

                .maple-final-cta {
                    padding: 4rem 0;
                    background: linear-gradient(135deg, #171a21 0%, #2f343d 62%, #8f0712 100%);
                    color: #ffffff;
                }

                .maple-final-cta__inner {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 2rem;
                }

                .maple-final-cta h2,
                .maple-final-cta p {
                    color: #ffffff;
                }

                .maple-final-cta p {
                    color: rgba(255, 255, 255, 0.78);
                }

                .ml-floating-container {
                    position: relative;
                    z-index: 30; 
                    margin-top: -2.9rem; 
                    margin-bottom: 2rem;
                }

                .ml-floating-bar {
                    display: flex;
                    align-items: center;
                    justify-content: space-evenly;
                    background: #ffffff;
                    border-radius: 6px;
                    padding: 15px 20px;
                    box-shadow: 0 1px 3px 0 rgba(0,0,0,.15), 0 2px 8px 0 rgba(0,0,0,.08);
                    flex-wrap: wrap;
                }

                .ml-floating-item {
                    display: flex;
                    align-items: center;
                    gap: 15px;
                    padding: 10px;
                    transition: transform 0.2s ease;
                    cursor: pointer;
                }
                
                .ml-floating-item:hover {
                    transform: translateY(-2px);
                }

                .ml-divider {
                    width: 1px;
                    height: 40px;
                    background-color: var(--maple-line);
                }

                .ml-icon {
                    width: 45px;
                    height: 45px;
                    object-fit: contain;
                    border-radius: 50%;
                }

                .ml-text {
                    display: flex;
                    flex-direction: column;
                }

                .ml-text strong {
                    font-size: 1.05rem;
                    color: var(--maple-ink);
                    line-height: 1.2;
                    font-weight: 600;
                }

                .ml-text span {
                    font-size: 0.9rem;
                    color: var(--maple-muted);
                    margin-top: 2px;
                }

                .maple-featured-products{

                    padding:80px 0;
                    background:var(--maple-bg);

                }

                .maple-featured-products .container{

                    max-width:1600px;
                    width:min(96%,1600px);
                    margin:auto;

                }

                /* Header */

                .maple-featured-products__header{

                    display:flex;
                    justify-content:space-between;
                    align-items:end;
                    gap:40px;
                    margin-bottom:40px;

                }

                .maple-featured-products__kicker{

                    color:var(--maple-primary);
                    text-transform:uppercase;
                    font-weight:700;
                    letter-spacing:.08em;
                    margin:0 0 10px;

                }

                .maple-featured-products__title{

                    font-size:clamp(2rem,2vw + 1rem,3rem);
                    font-weight:700;
                    margin:0;

                }

                .maple-featured-products__subtitle{

                    margin-top:12px;
                    max-width:700px;
                    color:var(--maple-muted);

                }

                .maple-featured-products__all{

                    display:flex;
                    align-items:center;
                    gap:.75rem;

                    background:var(--maple-primary);
                    color:#fff;

                    padding:14px 28px;

                    border-radius:12px;

                    text-decoration:none;

                    transition:.25s;

                }

                .maple-featured-products__all:hover{

                    background:#133D87;

                }

                /* Carrusel */

                .maple-carousel{

                    position:relative;

                }

                .maple-carousel__viewport{

                    overflow:hidden;

                }

                .maple-carousel__track{

                    display:flex;
                    gap:24px;

                    transition:transform .45s ease;

                    will-change:transform;

                }

                /* Tarjeta */

                .maple-product-card{

                    min-width:300px;
                    width:300px;

                    display:flex;
                    flex-direction:column;

                    background:white;

                    border:1px solid var(--maple-border);

                    border-radius:18px;

                    overflow:hidden;

                    box-shadow:var(--maple-shadow);

                    transition:.25s;

                }

                .maple-product-card:hover{

                    transform:translateY(-8px);

                }

                .maple-product-card__image-wrapper{

                    aspect-ratio:1;

                    display:flex;

                    justify-content:center;

                    align-items:center;

                    padding:28px;

                    background:white;

                }

                .maple-product-card__image{

                    width:100%;

                    height:100%;

                    object-fit:contain;

                }

                .maple-product-card__image,
                .maple-product-card a {
                    -webkit-user-drag: none;
                    -khtml-user-drag: none;
                    -moz-user-drag: none;
                    -o-user-drag: none;
                    user-drag: none;
                }

                .maple-product-card__content{

                    display:flex;

                    flex-direction:column;

                    flex:1;

                    padding:24px;

                }

                .maple-product-card__brand{

                    font-size:.80rem;

                    font-weight:800;

                    color:black;

                    text-transform:uppercase;

                }

                .maple-product-card__name{

                    margin-top:8px;

                    font-weight:700;

                    color:#111;

                    text-decoration:none;

                    display:-webkit-box;

                    -webkit-line-clamp:2;

                    -webkit-box-orient:vertical;

                    overflow:hidden;

                }

                .maple-product-card__description{

                    margin-top:12px;

                    color:var(--maple-muted);

                    font-size:.90rem;

                    display:-webkit-box;

                    -webkit-line-clamp:3;

                    -webkit-box-orient:vertical;

                    overflow:hidden;

                }

                .maple-product-card__footer{

                    margin-top:auto;

                }

                .maple-product-card__price{

                    margin:28px 0;

                    font-size:2rem;

                    font-weight:700;

                    color:#222;

                }

                .maple-product-card__actions{

                    display:flex;

                    gap:10px;

                }

                .maple-product-card__cart{

                    flex:1;

                    border:none;

                    border-radius:10px;

                    background: var(--maple-primary);

                    color:white;

                    height:46px;

                    cursor:pointer;

                }

                .maple-product-card__wishlist{

                    display:flex;

                    align-items:center;

                    justify-content:center;

                    width:46px;

                    height:46px;

                    border:none;

                    border-radius:10px;

                    background:var(--maple-secondary);

                    color:white;

                    cursor:pointer;

                    text-decoration:none;

                }

                /* Flechas */

                .maple-carousel__button{

                    position:absolute;

                    top:45%;

                    width:52px;

                    height:52px;

                    border-radius:50%;

                    border:none;

                    background:white;

                    box-shadow:var(--maple-shadow);

                    cursor:pointer;

                document.addEventListener("click", function(event) {
                    const card = event.target.closest(".maple-category-card");

                    if(!card) return;

                    const categoryId = card.dataset.categoryId;

                    const category = mapleFindCategory(categoryId);

                    if(!category) return;

                document.addEventListener("DOMContentLoaded", function() {

                  const slides = Array.from(document.querySelectorAll(".maple-hero__slide"));
                  const dotsContainer = document.querySelector(".maple-dots");
                  const nextButton = document.querySelector(".maple-next");
                  const prevButton = document.querySelector(".maple-prev");

                  if (!slides.length || !dotsContainer || !nextButton || !prevButton) {
                      return;
                  }

                  let current = 0;

                  slides.forEach(function(slide, index) {

                      const dot = document.createElement("span");

                      dot.className = "maple-dot";

                      if (index === 0) {
                          dot.classList.add("active");
                      }

                      dot.addEventListener("click", function() {
                          show(index);
                      });

                      dotsContainer.appendChild(dot);

                  });

                  const dots = Array.from(dotsContainer.querySelectorAll(".maple-dot"));

                  function show(index) {
                      if (!slides[index] || !dots[index] || index === current) {
                          return;
                      }

                      slides[current].classList.remove("active");
                      dots[current].classList.remove("active");
                      current = index;
                      slides[current].classList.add("active");
                      dots[current].classList.add("active");
                  }

                  function next() {
                      show((current + 1) % slides.length);
                  }

                  function prev() {
                      show((current - 1 + slides.length) % slides.length);
                  }

                  nextButton.addEventListener("click", next);
                  prevButton.addEventListener("click", prev);

                  const mediaQueryInterval = window.matchMedia("(max-width: 991px)");
                  let intervalId;

                  function updateInterval(e) {
                    clearInterval(intervalId);
                    if (e.matches) {
                      intervalId = setInterval(next, 6000);
                    }
                  }

                  if (mediaQueryInterval.addEventListener) {
                      mediaQueryInterval.addEventListener("change", updateInterval);
                  }
                  updateInterval(mediaQueryInterval);
              });

                document.addEventListener("DOMContentLoaded", function() {
                    const hero = document.querySelector(".maple-hero");
                    const prevBtn = document.querySelector(".maple-prev");
                    const nextBtn = document.querySelector(".maple-next");

                    if  (hero &amp;&amp; prevBtn &amp;&amp; nextBtn) {
                        hero.addEventListener('click', function(e) {
                            if (e.target.closest('a, button')) {
                                return;
                            }

                            if (window.innerWidth &lt;= 991) {
                                const rect = hero.getBoundingClientRect();
                                const clickX = e.clientX - rect.left;
                                const midPoint = rect.width / 2;

                                if (clickX &lt; midPoint) {
                                    prevBtn.click();
                                } else {
                                    nextBtn.click();
                                }
                            }
                        });
                    }
                });

                // Carrusel de productos en página de inicio

                class MapleFeaturedProducts {

                    constructor(container) {
                        if (!container) throw new Error("Container is required for MapleFeaturedProducts");
                        
                        // DOM Elements
                        this.dom = {
                            root: container,
                            track: null,
                            prevBtn: null,
                            nextBtn: null,
                            slides: []
                        };

                        // State variables
                        this.state = {
                            products: [],
                            currentIndex: 0,
                            visibleCards: 1,
                            cardWidth: 0,
                            gap: 16, // Default gap
                            isDragging: false,
                            hasDragged: false,
                            startX: 0,
                            currentX: 0,
                            dragOffset: 0,
                            isTransitioning: false,
                            autoplayTimer: null,
                            isPaused: false,
                            cloneCount: 0,
                            reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
                        };

                        // Observers and Controllers
                        this.abortController = null;
                        this.resizeObserver = null;
                        this.intersectionObserver = null;
                        this.mutationObserver = null;

                        // Configuration
                        this.config = {
                            autoplayInterval: 6000,
                            transitionDuration: 300,
                            snapThreshold: 50, // Minimum drag distance to trigger slide change
                            dragFriction: 0.85
                        };

                        // Bindings for event listeners
                        this._handleDragStart = this._handleDragStart.bind(this);
                        this._handleDragMove = this._handleDragMove.bind(this);
                        this._handleDragEnd = this._handleDragEnd.bind(this);
                        this._handleTransitionEnd = this._handleTransitionEnd.bind(this);
                    }

                    /**
                     * Initializes the carousel instance.
                     */
                    async init() {
                        this.cacheDOM();
                        this.setupObservers();
                        
                        const success = await this.loadProducts();
                        if (!success) return;

                        this.bindEvents();
                        this.update();
                        this.startAutoplay();
                    }

                    /**
                     * Caches required DOM elements to minimize DOM queries.
                     */
                    cacheDOM() {
                        this.dom.track = this.dom.root.querySelector('.maple-carousel__track');
                        if (!this.dom.track) {
                            const viewport = document.createElement('div');
                            viewport.classList.add('maple-carousel__viewport');

                            this.dom.track = document.createElement('div');
                            this.dom.track.classList.add('maple-carousel__track');
                            viewport.append(this.dom.track);
                            this.dom.root.append(viewport);
                        }

                        this.dom.prevBtn = this.dom.root.querySelector('.maple-carousel__button--prev') || this.createNavigationButton('prev');
                        this.dom.nextBtn = this.dom.root.querySelector('.maple-carousel__button--next') || this.createNavigationButton('next');
                    }

                    createNavigationButton(direction) {
                        const btn = document.createElement('button');
                        btn.classList.add('maple-carousel__button', `maple-carousel__button--${direction}`);
                        btn.setAttribute('aria-label', direction === 'prev' ? 'Productos anteriores' : 'Productos siguientes');
                        btn.type = 'button';
                        btn.innerHTML = direction === 'prev' ? '&lt;i class="fa fa-angle-left"&gt;&lt;/i&gt;' : '&lt;i class="fa fa-angle-right"&gt;&lt;/i&gt;';
                        this.dom.root.append(btn);
                        return btn;
                    }

                    /**
                     * Binds all necessary event listeners.
                     */
                    bindEvents() {
                        if (this.dom.prevBtn) {
                            this.dom.prevBtn.addEventListener('click', () =&gt; this.prev());
                        }
                        if (this.dom.nextBtn) {
                            this.dom.nextBtn.addEventListener('click', () =&gt; this.next());
                        }

                        this.dom.track.addEventListener('transitionend', this._handleTransitionEnd);

                        this.setupMouseDrag();
                        this.setupKeyboard();
                        this.setupWheel();

                        // Hover pause
                        this.dom.root.addEventListener('mouseenter', () =&gt; this.pause(), { passive: true });
                        this.dom.root.addEventListener('mouseleave', () =&gt; this.resume(), { passive: true });
                        
                        // Visibility API
                        document.addEventListener('visibilitychange', () =&gt; {
                            if (document.hidden) this.pause();
                            else this.resume();
                        });
                    }
                    
                    async loadProducts() {
                        try {
                            const rawProducts = await this.fetchProducts();
                            if (!rawProducts || rawProducts.length === 0) {
                                this.renderEmptyState('No hay productos destacados disponibles.');
                                return false;
                            }

                            this.state.products = rawProducts
                                .map(p =&gt; this.normalizeProduct(p));

                            this.renderProducts();
                            return true;
                        } catch (error) {
                            console.error('[MapleFeaturedProducts] Error loading products:', error);
                            this.renderEmptyState('No fue posible cargar los productos destacados.');
                            return false;
                        }
                    }

                    async fetchProducts() {
                        if (this.abortController) {
                            this.abortController.abort();
                        }
                        this.abortController = new AbortController();

                        const response = await fetch('https://maple-carousel-api.vercel.app/api/productos', {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json'
                            },
                            signal: this.abortController.signal
                        });

                        if (!response.ok) {
                            throw new Error(`Error HTTP: ${response.status}`);
                        }

                        const data = await response.json();

                        return data || [];
                    }

                    normalizeProduct(rawData) {
                        return {
                            id: rawData.id,
                            name: rawData.name || 'Product',
                            code: rawData.default_code || '',
                            url: rawData.website_url || `/shop/product/${rawData.id}`,
                            description: rawData.description_sale || '',
                            price: rawData.list_price || 0,
                            currency: Array.isArray(rawData.currency_id) ? rawData.currency_id[1] : (rawData.currency_id || '$'),
                            currencyId: Array.isArray(rawData.currency_id) ? rawData.currency_id[0] : null,
                            image: rawData.image_url || null,
                            brand: rawData.default_code || ''
                        };
                    }

                    renderEmptyState(message) {
                        const empty = document.createElement('p');
                        empty.classList.add('maple-featured-products__subtitle');
                        empty.textContent = message;
                        this.dom.track.replaceChildren(empty);
                    }

                    /**
                     * Orchestrates DOM construction for all product cards.
                     */
                    renderProducts() {
                        const fragment = document.createDocumentFragment();

                        this.calculateVisibleCards();
                        this.calculateGap();

                        const repeatCount = Math.max(this.state.visibleCards * 12, 36);
                        this.state.loopStartIndex = Math.floor(repeatCount / 2);

                        for (let index = 0; index &lt; repeatCount; index++) {
                            const product = this.state.products[index % this.state.products.length];
                            const card = this.createCard(product);
                            card.dataset.loopIndex = index;
                            fragment.append(card);
                        }

                        this.dom.track.replaceChildren(fragment);
                        this.dom.slides = Array.from(this.dom.track.children);
                        
                        // Initial setup for sizing
                        this.handleResize();
                        this.state.currentIndex = this.state.loopStartIndex;
                        this.scrollTo(this.state.currentIndex, false);
                    }

                    createCard(product) {
                        const article = document.createElement('article');
                        article.classList.add('maple-product-card');
                        article.dataset.productId = product.id;
                        article.tabIndex = 0;
                        article.setAttribute('aria-label', product.name);

                        const imageLink = document.createElement('a');
                        imageLink.classList.add('maple-product-card__image-link');
                        imageLink.href = product.url;
                        imageLink.append(this.createImage(product));

                        const content = document.createElement('div');
                        content.classList.add('maple-product-card__content');

                        const brand = document.createElement('div');
                        brand.classList.add('maple-product-card__brand');
                        brand.textContent = product.brand;

                        const name = document.createElement('a');
                        name.classList.add('maple-product-card__name');
                        name.href = product.url;
                        name.textContent = product.name;

                        const footer = document.createElement('div');
                        footer.classList.add('maple-product-card__footer');
                        footer.append(this.createPrice(product), this.createButtons(product));

                        content.append(brand, name, this.createDescription(product), footer);
                        article.append(imageLink, content);
                        return article;
                    }

                    createImage(product) {
                        const wrapper = document.createElement('div');
                        wrapper.classList.add('maple-product-card__image-wrapper');

                        const img = document.createElement('img');
                        img.classList.add('maple-product-card__image');
                        img.src = this.getImageUrl(product);
                        img.alt = product.name;
                        img.loading = 'lazy';
                        img.decoding = 'async';
                        
                        // Fallback for broken images
                        img.addEventListener('error', () =&gt; {
                            img.src = '/web/static/img/placeholder.png';
                        });

                        wrapper.append(img);
                        return wrapper;
                    }

                    createDescription(product) {
                        const desc = document.createElement('p');
                        desc.classList.add('maple-product-card__description');
                        desc.textContent = product.description.substring(0, 80) + (product.description.length &gt; 80 ? '...' : '');
                        return desc;
                    }

                    createPrice(product) {
                        const priceWrapper = document.createElement('div');
                        priceWrapper.classList.add('maple-product-card__price');

                        const currentPrice = document.createElement('span');
                        currentPrice.classList.add('maple-product-card__price-current');
                        currentPrice.textContent = this.formatPrice(product.price, product.currency);

                        priceWrapper.append(currentPrice);
                        return priceWrapper;
                    }

                    createButtons(product) {
                        const wrapper = document.createElement('div');
                        wrapper.classList.add('maple-product-card__actions');

                        const addBtn = document.createElement('button');
                        addBtn.type = 'button';
                        addBtn.classList.add('maple-product-card__cart');
                        addBtn.setAttribute('aria-label', `Ver ${product.name}`);
                        addBtn.textContent = 'Ver producto';
                        
                        addBtn.addEventListener('click', (e) =&gt; {
                            e.preventDefault();
                            e.stopPropagation();
                            window.location.href = product.url;
                        });

                        const wishlistBtn = document.createElement('a');
                        wishlistBtn.classList.add('maple-product-card__wishlist');
                        wishlistBtn.href = product.url;
                        wishlistBtn.setAttribute('aria-label', `Ver detalles de ${product.name}`);
                        wishlistBtn.innerHTML = '&lt;i class="fa fa-search"&gt;&lt;/i&gt;';

                        wrapper.append(addBtn, wishlistBtn);
                        return wrapper;
                    }

                    formatPrice(price, currency) {
                        // Fallback simple formatter if Odoo's session context isn't readily available
                        const formatter = new Intl.NumberFormat('en-US', {
                            style: 'currency',
                            currency: typeof currency === 'string' &amp;&amp; currency.length === 3 ? currency : 'USD'
                        });
                        return formatter.format(price);
                    }

                    getImageUrl(product) {
                        if (product.image) {
                            return product.image;
                        }
                        return '/web/static/img/placeholder.png';
                    }

                    /**
                     * Navigates to the next slide.
                     */
                    next() {
                        if (this.state.isTransitioning) return;
                        this.goTo(this.state.currentIndex + 1);
                    }

                    /**
                     * Navigates to the previous slide.
                     */
                    prev() {
                        if (this.state.isTransitioning) return;
                        this.goTo(this.state.currentIndex - 1);
                    }

                    goTo(index) {
                        const totalSlides = this.dom.slides.length;
                        const edgeBuffer = Math.max(this.state.visibleCards * 2, 6);

                        if (totalSlides &gt; edgeBuffer * 2) {
                            if (index &gt;= totalSlides - edgeBuffer) {
                                index = this.state.loopStartIndex + (index % this.state.products.length);
                            } else if (index &lt; edgeBuffer) {
                                index = this.state.loopStartIndex - (this.state.products.length - (index % this.state.products.length));
                            }
                        }

                        

                        this.state.currentIndex = index;
                        this.scrollTo(this.state.currentIndex, !this.state.reducedMotion);
                    }

                    scrollTo(index, smooth = true) {
                        const offset = -(index * (this.state.cardWidth + this.state.gap));
                        
                        if (smooth) {
                            this.state.isTransitioning = true;
                            this.dom.track.style.transition = `transform ${this.config.transitionDuration}ms ease-out`;
                        } else {
                            this.dom.track.style.transition = 'none';
                        }

                        requestAnimationFrame(() =&gt; {
                            this.dom.track.style.transform = `translate3d(${offset}px, 0, 0)`;
                        });

                     * Updates internal calculations for dimensions.
                     */
                    update() {
                        this.calculateVisibleCards();
                        this.calculateGap();
                        this.calculateCardWidth();
                        this.dom.slides.forEach(slide =&gt; {
                            slide.style.width = `${this.state.cardWidth}px`;
                            slide.style.marginRight = `${this.state.gap}px`;
                        });
                    }

                    /**
                    * Calculates how many cards should be visible based on container width.
                    */
                    calculateVisibleCards() {
                        const width = this.dom.root.clientWidth;
                        if (width &gt;= 1200) this.state.visibleCards = 4;
                        else if (width &gt;= 992) this.state.visibleCards = 3;
                        else if (width &gt;= 576) this.state.visibleCards = 2;
                        else this.state.visibleCards = 1;
                    }

                    /**
                    * Extracts gap from computed CSS or uses default.
                    */
                    calculateGap() {
                        const style = window.getComputedStyle(this.dom.track);
                        this.state.gap = parseFloat(style.columnGap) || 16;
                    }

                    /**
                    * Calculates precise card width based on available space and gap.
                    */
                    calculateCardWidth() {
                        const totalGapSpace = this.state.gap * (this.state.visibleCards - 1);
                        const availableWidth = this.dom.root.clientWidth - totalGapSpace;
                        this.state.cardWidth = availableWidth / this.state.visibleCards;
                    }

                    calculatePages() {
                        return Math.ceil(this.state.products.length / this.state.visibleCards);
                    }

                    /**
                    * Handles window/container resizing efficiently.
                    */
                    handleResize() {
                        const prevVisible = this.state.visibleCards;
                        this.update();
                        
                        // Adjust index if visible cards changed to avoid jumping into clone dead-zones
                        if (prevVisible !== this.state.visibleCards) {
                            this.scrollTo(this.state.currentIndex, false);
                        } else {
                            // Force layout recalculation without transition
                            this.scrollTo(this.state.currentIndex, false);
                        }
                    }

                    /**
                    * Handles the end of a CSS transition for infinite looping.
                    */
                    _handleTransitionEnd() {
                        this.state.isTransitioning = false;
                        
                        const totalReal = this.state.products.length;
                        const totalClonedFront = this.state.cloneCount;
                        
                        // If moved into cloned elements at the end
                        if (this.state.currentIndex &gt;= totalReal + totalClonedFront) {
                            this.state.currentIndex = this.state.currentIndex - totalReal;
                            this.scrollTo(this.state.currentIndex, false);
                        }
                        // If moved into cloned elements at the beginning
                        else if (this.state.currentIndex &lt; totalClonedFront) {
                            this.state.currentIndex = this.state.currentIndex + totalReal;
                            this.scrollTo(this.state.currentIndex, false);
                        }
                    }

                    /**
                    * Starts the autoplay interval.
                    */
                    startAutoplay() {
                        if (this.state.reducedMotion) return;
                        this.stopAutoplay();
                        this.state.autoplayTimer = setInterval(() =&gt; {
                            if (!this.state.isPaused &amp;&amp; !this.state.isDragging) {
                                this.next();
                            }
                        }, this.config.autoplayInterval);
                    }

                    /**
                    * Clears the autoplay interval.
                    */
                    stopAutoplay() {
                        if (this.state.autoplayTimer) {
                            clearInterval(this.state.autoplayTimer);
                            this.state.autoplayTimer = null;
                        }
                    }

                    /**
                    * Pauses autoplay (e.g., on hover or hidden visibility).
                    */
                    pause() {
                        this.state.isPaused = true;
                    }

                    /**
                    * Resumes autoplay.
                    */
                    resume() {
                        this.state.isPaused = false;
                    }

                    /**
                    * Centralized setup for observers.
                    */
                    setupObservers() {
                        this.setupResizeObserver();
                        this.setupIntersectionObserver();
                        this.setupMutationObserver();
                    }

                    /**
                    * Observes container resize events to calculate responsiveness.
                    */
                    setupResizeObserver() {
                        this.resizeObserver = new ResizeObserver((entries) =&gt; {
                            requestAnimationFrame(() =&gt; {
                                if (entries.length &gt; 0) this.handleResize();
                            });
                        });
                        this.resizeObserver.observe(this.dom.root);
                    }

                    /**
                    * Observes visibility to pause/resume rendering/autoplay.
                    */
                    setupIntersectionObserver() {
                        this.intersectionObserver = new IntersectionObserver((entries) =&gt; {
                            entries.forEach(entry =&gt; {
                                if (entry.isIntersecting) {
                                    this.resume();
                                } else {
                                    this.pause();
                                }
                            });
                        }, { threshold: 0.1 });
                        this.intersectionObserver.observe(this.dom.root);
                    }

                    /**
                    * Observes removal from DOM to clean up memory.
                    */
                    setupMutationObserver() {
                        this.mutationObserver = new MutationObserver((mutations) =&gt; {
                            mutations.forEach(mutation =&gt; {
                                mutation.removedNodes.forEach(node =&gt; {
                                    if (node === this.dom.root) {
                                        this.destroy();
                                    }
                                });
                            });
                        });
                        this.mutationObserver.observe(document.body, { childList: true, subtree: true });
                    }

                    /**
                    * Configures keyboard navigation (Arrows).
                    */
                    setupKeyboard() {
                        this.dom.root.addEventListener('keydown', (e) =&gt; {
                            switch(e.key) {
                                case 'ArrowLeft':
                                    this.prev();
                                    break;
                                case 'ArrowRight':
                                    this.next();
                                    break;
                            }
                        }, { passive: true });
                    }

                    /**
                    * Configures horizontal scroll wheel navigation.
                    */
                    setupWheel() {
                        let wheelTimeout;
                        this.dom.track.addEventListener('wheel', (e) =&gt; {
                            // Only react to significant horizontal scrolling
                            if (Math.abs(e.deltaX) &gt; Math.abs(e.deltaY) &amp;&amp; Math.abs(e.deltaX) &gt; 20) {
                                e.preventDefault();
                                clearTimeout(wheelTimeout);
                                wheelTimeout = setTimeout(() =&gt; {
                                    if (e.deltaX &gt; 0) this.next();
                                    else this.prev();
                                }, 50);
                            }
                        }, { passive: false });
                    }

                    /**
                    * Configures mouse drag interactions.
                    */
                    setupMouseDrag() {
                        this.dom.track.style.touchAction = 'pan-y';

                        this.dom.track.addEventListener('pointerdown', this._handleDragStart, { passive: true });
                        document.addEventListener('pointermove', this._handleDragMove, { passive: false });
                        document.addEventListener('pointerup', this._handleDragEnd, { passive: true });
                        document.addEventListener('pointercancel', this._handleDragEnd, { passive: true });

                        this.dom.track.addEventListener('dragstart', (e) =&gt; e.preventDefault());
                        
                        this.dom.track.addEventListener('click', (e) =&gt; {
                            if (this.state.hasDragged) {
                                e.preventDefault();
                                e.stopPropagation();
                            }
                        }, { capture: true });
                    }

                    /**
                    * Configures touch interactions.
                    */
                    // setupTouch() {
                    //     this.dom.track.addEventListener('touchstart', this._handleDragStart, { passive: true });
                    //     document.addEventListener('touchmove', this._handleDragMove, { passive: false });
                    //     document.addEventListener('touchend', this._handleDragEnd, { passive: true });
                    // }

                    _handleDragStart(e) {
                        if (e.type === 'pointerdown' &amp;&amp; e.pointerType === 'mouse' &amp;&amp; e.button !== 0) return; 
                        if (e.pointerId !== undefined) {
                            this.dom.track.setPointerCapture(e.pointerId);
                        }
                        
                        this.state.isDragging = true;
                        this.state.hasDragged = false;
                        this.state.isTransitioning = false;
                        this.pause();

                        this.state.startX = e.clientX;
                        this.dom.track.style.transition = 'none';
                    }

                    _handleDragMove(e) {
                        if (!this.state.isDragging) return;
                        
                        // Prevent default scrolling when dragging horizontally
                        if (e.cancelable) e.preventDefault();

                        this.state.currentX = e.clientX;
                        
                        const diff = this.state.currentX - this.state.startX;

                        if (Math.abs(diff) &gt; 5) {
                            this.state.hasDragged = true;
                        }

                        this.state.dragOffset = diff * this.config.dragFriction;
                        
                        const baseOffset = -(this.state.currentIndex * (this.state.cardWidth + this.state.gap));
                        const currentTransform = baseOffset + this.state.dragOffset;

                        requestAnimationFrame(() =&gt; {
                            this.dom.track.style.transform = `translate3d(${currentTransform}px, 0, 0)`;
                        });
                    }

                    /**
                    * Internal drag end handler.
                    */
                    _handleDragEnd() {
                        if (!this.state.isDragging) return;
                        this.state.isDragging = false;
                        this.resume();

                        const distance = this.state.dragOffset;
                        this.state.dragOffset = 0;

                        // Determine if we dragged enough to trigger a slide change
                        if (Math.abs(distance) &gt; this.config.snapThreshold) {
                            if (distance &gt; 0) {
                                this.prev();
                            } else {
                                this.next();
                            }
                        } else {
                            // Snap back to current
                            this.scrollTo(this.state.currentIndex, true);
                        }
                    }

                    cloneSlides() {
                        const children = Array.from(this.dom.track.children);
                        if (children.length === 0) return;

                        // Clone enough cards to keep the viewport filled even when Odoo returns very few products.
                        const clonesNeeded = Math.max(this.state.visibleCards * 2, 8);
                        this.state.cloneCount = clonesNeeded;

                        const fragmentBefore = document.createDocumentFragment();
                        const fragmentAfter = document.createDocumentFragment();

                        // Clone for end (append)
                        for (let i = 0; i &lt; clonesNeeded; i++) {
                            const index = i % children.length;
                            const clone = children[index].cloneNode(true);
                            clone.classList.add('maple-clone');
                            clone.setAttribute('aria-hidden', 'true');
                            clone.tabIndex = -1; // Remove from focus order
                            fragmentAfter.append(clone);
                        }

                        // Clone for beginning (prepend)
                        for (let i = 0; i &lt; clonesNeeded; i++) {
                            const index = children.length - 1 - (i % children.length);
                            const clone = children[index].cloneNode(true);
                            clone.classList.add('maple-clone');
                            clone.setAttribute('aria-hidden', 'true');
                            clone.tabIndex = -1;
                            fragmentBefore.prepend(clone);
                        }

                        this.dom.track.prepend(fragmentBefore);
                        this.dom.track.append(fragmentAfter);
                    }


                    destroy() {
                        this.stopAutoplay();
                        
                        if (this.abortController) {
                            this.abortController.abort();
                        }
                        
                        if (this.resizeObserver) this.resizeObserver.disconnect();
                        if (this.intersectionObserver) this.intersectionObserver.disconnect();
                        if (this.mutationObserver) this.mutationObserver.disconnect();

                        document.removeEventListener('pointermove', this._handleDragMove);
                        document.removeEventListener('pointerup', this._handleDragEnd);
                        document.removeEventListener('pointercancel', this._handleDragEnd);

                        // Remove track content
                        if (this.dom.track) {
                            this.dom.track.innerHTML = '';
                        }
                    }
                }

                // Global initialization
                document.addEventListener('DOMContentLoaded', () =&gt; {
                    const containers = document.querySelectorAll('.s_maple_featured_products');
                    containers.forEach(container =&gt; {
                        const carousel = new MapleFeaturedProducts(container);
                        carousel.init();
                    });
                });
            </script>
        </xpath>
