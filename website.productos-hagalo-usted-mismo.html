                    },
                    "DS-PD201PC10-WB": {

                    },
                    "DS-PC201N": {
                        tamanoPropiedadAsignado: ["pequeño"],
                        isControlledByPhone: true,
                        isViableConMascotas: false,
                        hayMonitoreoDisponible: false,
                        categoriasDestino: ["11"]
                    }
                };

                document.addEventListener('DOMContentLoaded', async () =&gt; {
                    const gridContainer = document.getElementById('gridProductosHagaloUsted');
                    const subtitulo = document.getElementById('subtituloFiltros');
                    const respuestasGuardadas = sessionStorage.getItem('hagalo_usted_respuestas');
                    const params = new URLSearchParams(window.location.search);
                    const categoryId = params.get('category');

                    if (!respuestasGuardadas) {
                        gridContainer.innerHTML = `
                            <div class="col-12 text-center py-5">
                                <p class="text-warning fw-bold">No se encontraron respuestas previas.</p>
                                <a href="/hagalo-usted-mismo" class="btn btn-outline-primary">Volver a iniciar</a>
                            </div>`;
                        return;
                    }

                    const respuestas = JSON.parse(respuestasGuardadas);
                    let tipoPropiedad = categoryId === "11" ? "Hogar" : categoryId === "12" ? "Negocio" : "Propiedad";
                    subtitulo.innerText = `Mostrando opciones para ${tipoPropiedad} de tamaño ${respuestas.tamano_propiedad}`;

                    try {
                        const respuestaAPI = await fetch('https://maple-carousel-api.vercel.app/api/productos');
                        const productosOdoo = await respuestaAPI.json();

                        const productosEnriquecidos = productosOdoo.map(producto =&gt; {
                            const reglas = CATALOGO_REGLAS[producto.default_code] || {
                                tamanoPropiedadAsignado: ["pequeño", "mediano", "grande"],
                                isControlledByPhone: true,
                                isViableConMascotas: true,
                                hayMonitoreoDisponible: true,
                                categoriasDestino: ["11", "12"]
                            };

                            return {
                                id: producto.id,
                                modelo: producto.default_code,
                                marca: producto.description_purchase,
                                productName: producto.name,
                                descripcion: producto.description_sale || '',
                                price: producto.list_price,
                                imgURL: producto.image_url,
                                websiteUrl: producto.website_url,
                                ...reglas
                            };
                        });

                        const productosFiltrados = productosEnriquecidos.filter(producto =&gt; {
                            const coincideTamano = producto.tamanoPropiedadAsignado.includes(respuestas.tamano_propiedad);
                            const coincideCelular = !respuestas.control_celular || producto.isControlledByPhone;
                            const coincideMascotas = !respuestas.tiene_mascotas || producto.isViableConMascotas;
                            const coincideCategoria = !categoryId || (producto.categoriasDestino &amp;&amp; producto.categoriasDestino.includes(categoryId));

                            return coincideTamano &amp;&amp; coincideCelular &amp;&amp; coincideMascotas &amp;&amp; coincideCategoria;
                        });

                        if (productosFiltrados.length === 0) {
                            gridContainer.innerHTML = '<p class="text-center col-12">No se encontraron productos exactos para esta configuración.</p>';
                            return;
                        }

                        let html = '';
                        productosFiltrados.forEach(producto =&gt; {
                            html += `
                                <div class="col-md-6 col-lg-4 mb-4">
                                    <div class="card h-100 shadow-sm border-0">
                                        <img src="${producto.imgURL}" class="card-img-top p-3" alt="${producto.productName}" style="max-height: 220px; object-fit: contain;"/>
                                        <div class="card-body d-flex flex-column">
                                            <div class="diy_model_brand_container">
                                                <small class="text-muted">${producto.modelo}</small>
                                                <small class="text-muted">${producto.marca}</small>
                                            </div>
                                            <h5 class="card-title mt-1">${producto.productName}</h5>
                                            <p class="card-text text-muted flex-grow-1" style="font-size: 0.9rem;">
                                                ${producto.descripcion}
                                            </p>
                                            <div class="d-flex justify-content-between align-items-center mt-3">
                                                <span class="fs-5 fw-bold text-primary">$${producto.price.toLocaleString('es-MX')} MXN</span>
                                                <a href="${producto.websiteUrl}" class="btn btn-primary btn-sm">Ver Producto</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        gridContainer.innerHTML = html;

                    } catch (err) {
                        console.error('Error al consultar productos:', err);
                        gridContainer.innerHTML = '<p class="text-center text-danger col-12">Ocurrió un error al cargar las recomendaciones.</p>';
                    }
                });
